preset:
  name: postgres
  description: "Host-side source-etls access through the read-only HTTP query bridge"

network_policies:
  postgres:
    name: postgres
    endpoints:
      - host: host.openshell.internal
        port: 3100
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: /usr/bin/python3.11 }
      - { path: /usr/local/bin/hermes }
