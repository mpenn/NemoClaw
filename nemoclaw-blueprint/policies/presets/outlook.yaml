preset:
  name: outlook
  description: "Microsoft Outlook and Graph API access"

network_policies:
  outlook:
    name: outlook
    endpoints:
      - host: graph.microsoft.com
        port: 443
        access: full
      - host: login.microsoftonline.com
        port: 443
        access: full
    binaries:
      - { path: /usr/bin/python3.11 }
