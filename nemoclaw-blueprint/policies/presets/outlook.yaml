preset:
  name: outlook
  description: "Microsoft Outlook and Graph API access"

network_policies:
  outlook:
    name: outlook
    endpoints:
      - host: graph.microsoft.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
          - allow: { method: PATCH, path: "/**" }
      - host: login.microsoftonline.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/bin/python3.11 }
