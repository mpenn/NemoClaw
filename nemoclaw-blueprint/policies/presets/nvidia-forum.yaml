preset:
  name: nvidia-forum
  description: "NVIDIA Developer Forums and Docs (forums.nvidia.com, docs.nvidia.com)"

network_policies:
  nvidia_forum:
    name: nvidia_forum
    endpoints:
      - host: docs.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      # Both apex and developer subdomain — one redirects to the other.
      # Port 80 needed — curl follows HTTP→HTTPS redirects.
      - host: forums.nvidia.com
        port: 80
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: forums.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: forums.developer.nvidia.com
        port: 80
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
      - host: forums.developer.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
          - allow: { method: HEAD, path: "/**" }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3.11 }
      - { path: /usr/local/bin/hermes }
